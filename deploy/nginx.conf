# /etc/nginx/sites-available/oncoscience
server {
    listen 80;
    server_name science.cancercenter.uz;

    # Redirect to HTTPS (after issuing a certificate, e.g. with certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 60M;  # katta PDF fayllar uchun

    location /static/ {
        alias /var/www/oncoscience/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/oncoscience/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/oncoscience.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

