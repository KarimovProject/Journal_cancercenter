name: Deploy Journal Cancer Center

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy code to app directory
        run: |
          rsync -avz --exclude='.git' --exclude='media' --exclude='.env' --exclude='staticfiles' --exclude='db.sqlite3' --exclude='env' --exclude='venv' --exclude='myvenv' --exclude='__pycache__' ./ /home/satosylv/Journal_cancercenter/

      - name: Rebuild and restart web container
        run: |
          cd /home/satosylv/Journal_cancercenter
          docker compose up -d --build web

      - name: Run migrations
        run: |
          cd /home/satosylv/Journal_cancercenter
          docker compose exec -T web python manage.py migrate

      - name: Collect static files
        run: |
          cd /home/satosylv/Journal_cancercenter
          docker compose exec -T web python manage.py collectstatic --noinput

      - name: Clean up unused Docker images
        run: docker image prune -f
